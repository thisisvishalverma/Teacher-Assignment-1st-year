<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A lightly styled version of the student registration form exercise.">
  <title>Student Registration - Light Styling</title>
  <style>
    body { max-width: 680px; margin: 2rem auto; padding: 0 1rem; color: #26384a; background: #faf9f5; font: 1rem/1.55 system-ui, sans-serif; }
    h1 { color: #28645e; }
    label { display: block; margin: .8rem 0 .25rem; }
    input, select { width: 100%; padding: .55rem; border: 1px solid #aab7b4; border-radius: .35rem; font: inherit; }
    button { margin-top: 1rem; padding: .6rem .9rem; border: 0; border-radius: .35rem; background: #28645e; color: white; font: inherit; }
    .hint { padding: .75rem; border-left: 3px solid #dda958; background: #fff2d8; }
  </style>
</head>
<body>
  <main>
    <h1>Student Registration</h1>
    <p class="hint">This page gives the registration exercise a little spacing, colour, and readable form controls.</p>
    <form action="#" method="get">
      <label for="name">Full name</label><input id="name" name="name" type="text" required>
      <label for="email">Email address</label><input id="email" name="email" type="email" required>
      <label for="phone">Phone number</label><input id="phone" name="phone" type="tel">
      <label for="course">Course</label><select id="course" name="course"><option>BCA with Artificial Intelligence</option><option>BCA</option><option>Other</option></select>
      <button type="submit">Review registration</button>
    </form>
  </main>
</body>
</html>
