<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A finished landing-page section arranged with Flexbox.">
  <title>Flexible Learning Landing Section</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; color: #203a38; background: #f5f7ef; font: 1rem/1.6 system-ui, sans-serif; }
    .section { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2rem; max-width: 1050px; margin: auto; padding: clamp(1.4rem, 5vw, 3.5rem); border-radius: 1.4rem; background: #e0eee4; }
    .text, .steps { flex: 1 1 280px; }
    h1 { max-width: 13ch; font-size: clamp(2.4rem, 7vw, 4.5rem); line-height: 1.02; }
    .steps { display: flex; flex-direction: column; gap: .75rem; }
    .step { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-radius: .7rem; background: white; }
    .number { display: grid; width: 2.5rem; aspect-ratio: 1; place-items: center; border-radius: 50%; background: #f1c66d; font-weight: 800; }
    a { display: inline-block; padding: .7rem 1rem; border-radius: 99px; background: #1c6258; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <main class="section">
    <section class="text"><p>Open Desk · learning club</p><h1>Learn something by building it.</h1><p>Turn a question into a page, a sketch, or a small experiment.</p><a href="#steps">See the three steps</a></section>
    <section id="steps" class="steps" aria-label="How to begin"><div class="step"><span class="number">1</span><span>Choose one question.</span></div><div class="step"><span class="number">2</span><span>Make a small example.</span></div><div class="step"><span class="number">3</span><span>Write down what changed.</span></div></section>
  </main>
</body>
</html>
