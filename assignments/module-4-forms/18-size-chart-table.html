<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An original clothing size chart with an accessible table caption and headers.">
  <title>Trail Tee Size Chart</title>
  <style>
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #24354b; font: 1rem/1.5 system-ui, sans-serif; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 540px; border-collapse: collapse; }
    caption { padding: .75rem; text-align: left; font-weight: 700; }
    th, td { padding: .75rem; border: 1px solid #aab9c3; text-align: left; }
    thead { background: #e7f1ed; }
    tbody tr:nth-child(even) { background: #f5f8f7; }
  </style>
</head>
<body>
  <main>
    <h1>Trail Tee Size Guide</h1>
    <p>Measurements are sample values. Check the product label before ordering.</p>
    <div class="table-wrap">
      <table>
        <caption>Garment measurements in centimetres</caption>
        <thead><tr><th scope="col">Size</th><th scope="col">Chest</th><th scope="col">Length</th><th scope="col">Sleeve</th></tr></thead>
        <tbody>
          <tr><th scope="row">S</th><td>92</td><td>66</td><td>20</td></tr>
          <tr><th scope="row">M</th><td>100</td><td>69</td><td>21</td></tr>
          <tr><th scope="row">L</th><td>108</td><td>72</td><td>22</td></tr>
          <tr><th scope="row">XL</th><td>116</td><td>75</td><td>23</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
