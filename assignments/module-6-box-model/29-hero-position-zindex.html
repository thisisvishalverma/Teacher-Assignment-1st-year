<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A landing hero showing relative and absolute positioning with z-index layers.">
  <title>Layered Hero Section</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; background: #f7f5ef; color: #203942; font: 1rem/1.55 system-ui, sans-serif; }
    .hero { position: relative; isolation: isolate; overflow: hidden; max-width: 1000px; min-height: 430px; margin: auto; padding: clamp(1.5rem, 6vw, 4rem); border-radius: 1.5rem; background: #d9eee5; }
    .shape { position: absolute; z-index: -1; border-radius: 50%; }
    .shape-one { width: 320px; height: 320px; right: -60px; top: -90px; background: #f2c56e; }
    .shape-two { width: 190px; height: 190px; right: 180px; bottom: -110px; background: #87c6b0; }
    .copy { position: relative; z-index: 1; max-width: 600px; }
    h1 { max-width: 12ch; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1; }
    a { display: inline-block; padding: .7rem 1rem; border-radius: 99px; background: #1f5e55; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <main class="hero">
    <div class="shape shape-one" aria-hidden="true"></div><div class="shape shape-two" aria-hidden="true"></div>
    <section class="copy"><p>Fieldnote · student projects</p><h1>Make a little room for ideas.</h1><p>Plan a small project, practise one skill, and share what you discover.</p><a href="#details">See how it works</a></section>
  </main>
  <section id="details" style="max-width: 900px; margin: 2rem auto; padding: 0 1rem"><h2>How it works</h2><p>The decorative circles sit behind the text through absolute positioning and z-index.</p></section>
</body>
</html>
