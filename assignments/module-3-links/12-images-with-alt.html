<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A portfolio gallery with meaningful alternative text for each image.">
  <title>Portfolio Gallery and Image Descriptions</title>
  <style>
    body { margin: 0; padding: 2rem; background: #f4f3ee; color: #24324a; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 900px; margin: auto; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    figure { margin: 0; padding: .75rem; background: white; border-radius: 1rem; }
    img { display: block; width: 100%; height: auto; border-radius: .6rem; }
  </style>
</head>
<body>
  <main>
    <h1>Small Things I Like to Build</h1>
    <p>Each illustration has alternative text that describes what it contributes.</p>
    <div class="gallery">
      <figure><img src="../../assets/images/study-desk.svg" alt="A notebook and pencil beside a small green plant"><figcaption>Quiet study corner</figcaption></figure>
      <figure><img src="../../assets/images/idea-cards.svg" alt="Three colourful cards arranged as steps in a learning plan"><figcaption>Learning plan</figcaption></figure>
      <figure><img src="../../assets/images/campus-path.svg" alt="A path winding between campus buildings and trees"><figcaption>Campus walk</figcaption></figure>
    </div>
  </main>
</body>
</html>
